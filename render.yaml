# Optional Render "Blueprint". You can also create the site by hand (see README).
services:
  - type: web
    name: trip-billing
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
